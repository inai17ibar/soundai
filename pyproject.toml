[project]
name = "soundai"
version = "0.1.0"
description = "Audio sample search and discovery powered by AI"
requires-python = ">=3.11"
dependencies = [
    "laion-clap>=1.1.4",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "faiss-cpu>=1.8.0",
    "pandas>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
    "matplotlib>=3.8",
    "umap-learn>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soundai"]
