[project]
name = "soundai"
version = "0.1.0"
description = "Audio sample search and discovery powered by AI"
requires-python = ">=3.11"
dependencies = [
    "laion-clap>=1.1.4",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "faiss-cpu>=1.8.0",
    "pandas>=2.2",
    "tqdm>=4.66",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
    "matplotlib>=3.8",
    "umap-learn>=0.5",
]
web = [
    "gradio>=5.0",
]
hil = [
    "hil-eval[server]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soundai"]

[tool.uv.sources]
hil-eval = { path = "../../hil-eval", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
